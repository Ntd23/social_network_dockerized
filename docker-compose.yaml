services:
  php-fpm:
    image: 192.168.1.223:5000/vnseea-php:latest
    build: .
    command: ["sh", "-c", "cp /var/www/html/php.ini /usr/local/etc/php/conf.d/custom.ini && php-fpm"]
    networks:
      - backend-net
      - frontend-net
    depends_on:
      - mariadb
    volumes:
      - ./config.php:/var/www/html/config.php:ro
      - ./upload:/var/www/html/upload
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '0.80'
          memory: 512M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.1.47:5140"
        tag: "vnseea-php"

  nuxt:
    image: 192.168.1.223:5000/vnseea-client:latest
    build: ./client
    env_file:
      - ./client/.env
    networks:
      - frontend-net
      - backend-net
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '0.80'
          memory: 512M
        reservations:
          memory: 128M
      restart_policy:
        condition: any
        delay: 5s
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.1.47:5140"
        tag: "vnseea-nuxt"
  realtime:
    image: 192.168.1.223:5000/vnseea-client:latest
    command: ["node", "realtime/notification-server.mjs"]
    env_file:
      - ./client/.env
    networks:
      - frontend-net
      - backend-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3015/healthz"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s

  push-worker:
    image: 192.168.1.223:5000/vnseea-php:latest
    command: ["php", "workers/push-delivery-worker.php", "--batch=50", "--idle-ms=500", "--max-memory-mb=192"]
    networks:
      - backend-net
    volumes:
      - ./config.php:/var/www/html/config.php:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == worker
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s

  redis:
    image: redis:7.4.12-alpine3.21
    networks:
      - backend-net
    volumes:
      - redis-data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.30.6-alpine
    ports:
      - "8080:80"
      - "443:443"
      - "80:80"
    networks:
      - frontend-net
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./upload:/var/www/html/upload:ro
      - ./themes:/var/www/html/themes:ro
      - ./assets:/var/www/html/assets:ro
      - ./admin-panel:/var/www/html/admin-panel:ro
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.80'
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s
    logging:
      driver: syslog
      options:
        syslog-address: "udp://192.168.1.47:5140"
        tag: "vnseea-nginx"  
  mariadb:
    image: mariadb:13.0.2
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: vnseea
    networks:
      - backend-net
    volumes:
      - mysql-data:/var/lib/mysql
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
        reservations:
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  backend-net:
    driver: overlay
    attachable: true
  frontend-net:
    driver: overlay
    attachable: true

volumes:
  mysql-data:
  redis-data: