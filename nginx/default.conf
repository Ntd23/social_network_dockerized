limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    server_name vnseea-docker.duckdns.org _;
    client_max_body_size 512M;
    charset utf-8;
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/vnseea.crt;
    ssl_certificate_key /etc/nginx/ssl/vnseea.key;
    root /var/www/html;
    index index.php index.html index.htm;

    location ^~ /.well-known/ {
        try_files $uri /;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location ^~ /realtime/ {
        proxy_pass http://realtime:3015/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location /socket.io/ {
        proxy_pass http://realtime:3015/socket.io/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /cache {
        deny all;
        return 404;
    }

    location /sources {
        deny all;
        return 404;
    }

    location /nodejs {
        deny all;
        return 404;
    }

    location /adminPages/ {
        alias /var/www/html/admin-panel/;
    }

    location ^~ /upload/ {
        try_files $uri =404;

        open_file_cache off;
        expires 30d;
        access_log off;
    }

    location ^~ /themes/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ^~ /assets/ {
        try_files $uri =404;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ^~ /_nuxt/ {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location ^~ /__vite_ping {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location ^~ /@vite/ {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location ^~ /@id/ {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
    }

    location ^~ /@fs/ {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location = /robots.txt {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 15;
        limit_req_status 429;

        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location ^~ /api/_nuxt_icon/ {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    location = /admincp {
        rewrite ^ /admincp.php last;
    }

    location /admincp {
        rewrite ^/admincp/(.*)$ /admincp.php?page=$1 last;
    }

    location /admin {
        rewrite ^/admin-cp$ /admincp.php last;
        rewrite ^/admin-cp/(.*)$ /admincp.php?page=$1 last;
        rewrite ^/admin/ads/edit/(\d+)(/?|)$ /index.php?link1=manage-ads&id=$1 last;
    }

    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 15;
        limit_req_status 429;

        rewrite ^/api(/?|)$ /api-v2.php last;
        rewrite ^/api/([^\/]+)(\/|)$ /api-v2.php?type=$1 last;
    }

    location ~ ^/(ajax_loading|requests|login-with|call|call_livekit|call_group_livekit|call_jitsi|cron-job|OneSignalSDKWorker|api-v2|api|app_api|admin_load|system_status|updater)\.php$ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 15;
        limit_req_status 429;

        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS $https if_not_empty;
        # Tránh lỗi: upstream sent too big header
        fastcgi_buffer_size 64k;
        fastcgi_buffers 16 64k;
        fastcgi_busy_buffers_size 128k;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS $https if_not_empty;
    }

    location / {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }
}
